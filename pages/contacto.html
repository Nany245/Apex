<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Apex Electrónica | Contacto</title>
	<link rel="stylesheet" href="/css/styles.css">
	<link rel="stylesheet" href="/css/contact.css">
	<link rel="icon" type="image/png" sizes="32x32" href="/img/Logo Apex.png">
</head>
<body>
	<div id="header-container"></div>

	<main>
		<section class="hero">
			<h2>Contáctanos</h2>
			<p>Estamos para ayudarte. Escríbenos, llámanos o visítanos.</p>
		</section>

		<div class="grid-contacto">

			<div class="datos">
				<h3 class="datos-titulo">¿Cómo llegarnos?</h3>

				<div class="canal">
					<div class="canal-icono">
						<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.41 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.77a16 16 0 0 0 6 6l.46-.46a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21 16.92z"/></svg>
					</div>
					<div class="canal-texto">
						<span class="canal-etiqueta">Teléfono</span>
						<a href="tel:0000000000">(000) 000-0000</a>
					</div>
				</div>

				<div class="canal">
					<div class="canal-icono">
						<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
					</div>
					<div class="canal-texto">
						<span class="canal-etiqueta">Correo</span>
						<a href="mailto:elcorreodelaempresaaaaa">adrix01x@gmail.com</a>
					</div>
				</div>

				<div class="canal">
					<div class="canal-icono">
						<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
					</div>
					<div class="canal-texto">
						<span class="canal-etiqueta">WhatsApp</span>
						<a href="https://wa.me/0000000000" target="_blank" rel="noopener">Enviar mensaje</a>
					</div>
				</div>

				<div class="canal">
					<div class="canal-icono">
						<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
					</div>
					<div class="canal-texto">
						<span class="canal-etiqueta">Dirección</span>
						<span class="canal-valor">Santo Domingo, República Dominicana</span>
					</div>
				</div>

				<div class="horario">
					<h4 class="horario-titulo">Horario de atención</h4>
					<div class="horario-fila">
						<span>Lunes – Viernes</span>
						<span>9:00 – 18:00</span>
					</div>
					<div class="horario-fila">
						<span>Sábado</span>
						<span>10:00 – 14:00</span>
					</div>
					<div class="horario-fila horario-cerrado">
						<span>Domingo</span>
						<span>Cerrado</span>
					</div>
				</div>
			</div>

			<div class="formulario-wrap">
				<form class="formulario" id="form-contacto" novalidate>
					<div class="campo">
						<label for="nombre">Nombre completo</label>
						<input type="text" id="nombre" name="nombre" placeholder="Tu nombre" autocomplete="name" required>
					</div>
					<div class="campo">
						<label for="correo">Correo electrónico</label>
						<input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
					</div>
					<div class="campo">
						<label for="telefono">Teléfono <span class="opcional">(opcional)</span></label>
						<input type="tel" id="telefono" name="telefono" placeholder="0000" autocomplete="tel">
					</div>
					<div class="campo">
						<label for="asunto">Asunto</label>
						<select id="asunto" name="asunto" required>
							<option value="" disabled selected>Selecciona un tema</option>
							<option value="reparacion">Reparación de dispositivo</option>
							<option value="presupuesto">presupuesto</option>
							<option value="garantia">garantia</option>
							<option value="otro">Otro</option>
						</select>
					</div>
					<div class="campo">
						<label for="mensaje">Mensaje</label>
						<textarea id="mensaje" name="mensaje" rows="5" placeholder="Describe tu problema o consulta..." required></textarea>
					</div>
					<button type="submit" class="btn-enviar">Enviar mensaje</button>
				</form>
			</div>

		</div>
	</main>

	<div id="footer-container"></div>
	<script src="/js/script.js"></script>
</body>
</html>
